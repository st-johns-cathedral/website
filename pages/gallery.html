<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Photo gallery for St. John's Cathedral, Nazareth." />
    <title>Gallery | St. John's Cathedral, Nazareth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css?v=gallery-2" />
    <link rel="stylesheet" href="../css/pages.css?v=gallery-2" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/print.css" />
  </head>
  <body data-page-title="Gallery | St. John's Cathedral, Nazareth">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="site-header"></div>

    <main id="main-content" class="page-shell">
      <section class="page-hero">
        <div class="container">
          <div class="hero-copy" data-reveal>
            <span class="eyebrow">Gallery</span>
            <h1>A visual story of worship and heritage</h1>
            <p>Images from the cathedral, its worship life, community festivals and heritage spaces.</p>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="filter-bar">
            <button class="filter-btn is-active" type="button" data-gallery-filter="All">All</button>
            <button class="filter-btn" type="button" data-gallery-filter="Architecture">Architecture</button>
            <button class="filter-btn" type="button" data-gallery-filter="Choir">Choir</button>
            <button class="filter-btn" type="button" data-gallery-filter="Festivals">Festivals</button>
            <button class="filter-btn" type="button" data-gallery-filter="Worship">Worship</button>
            <button class="filter-btn" type="button" data-gallery-filter="Community">Community</button>
          </div>

          <div class="gallery-grid" data-gallery-grid></div>
        </div>
      </section>
    </main>

    <div class="lightbox" data-lightbox aria-label="Image viewer">
      <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close image view">×</button>
      <div class="lightbox-dialog">
        <div class="lightbox-media">
          <img src="" alt="" />
        </div>
        <figcaption></figcaption>
      </div>
    </div>

    <div id="site-footer"></div>

    <script src="../js/config.js"></script>
    <script src="../js/data.js?v=4"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/gallery.js?v=4"></script>
  </body>
</html>
