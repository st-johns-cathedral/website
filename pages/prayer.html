<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prayer request form for St. John's Cathedral, Nazareth." />
    <title>Prayer Requests | St. John's Cathedral, Nazareth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/print.css" />
  </head>
  <body data-page-title="Prayer Requests | St. John's Cathedral, Nazareth">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="site-header"></div>

    <main id="main-content" class="page-shell">
      <section class="page-hero">
        <div class="container">
          <div class="hero-copy" data-reveal>
            <span class="eyebrow">Prayer</span>
            <h1>Share your prayer request</h1>
            <p>We pray with you in faith and with compassion. Use the form below and we will receive it for pastoral care and prayer.</p>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="prayer-layout">
            <aside class="card" data-reveal>
              <h3>Daily verse</h3>
              <p class="verse-box" data-verse>"Trust in the Lord with all your heart..."</p>
            </aside>

            <div class="card" data-reveal>
              <form data-validate data-email="stjohnscathedralnazareth@gmail.com">
                <div class="form-field">
                  <label for="name">Full name</label>
                  <input id="name" name="name" type="text" required />
                </div>
                <div class="form-field">
                  <label for="email">Email address</label>
                  <input id="email" name="email" type="email" required />
                </div>
                <div class="form-field">
                  <label for="request">Prayer request</label>
                  <textarea id="request" name="request" rows="6" required></textarea>
                </div>
                <div class="form-field" style="display:none;">
                  <label for="website">Website</label>
                  <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
                </div>
                <button class="btn btn-primary" type="submit">Send Request</button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="../js/config.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/forms.js"></script>
  </body>
</html>
