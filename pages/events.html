<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Upcoming events and festival calendar for St. John's Cathedral, Nazareth." />
    <title>Events | St. John's Cathedral, Nazareth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/print.css" />
  </head>
  <body data-page-title="Events | St. John's Cathedral, Nazareth">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="site-header"></div>

    <main id="main-content" class="page-shell">
      <section class="page-hero">
        <div class="container">
          <div class="hero-copy" data-reveal>
            <span class="eyebrow">Events</span>
            <h1>Festival calendar and activities</h1>
            <p>From worship gatherings to community events and annual festivals, the church calendar reflects life in Christ and service to the community.</p>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="filter-bar">
            <button class="filter-btn is-active" type="button" data-filter="All">All</button>
            <button class="filter-btn" type="button" data-filter="Worship">Worship</button>
            <button class="filter-btn" type="button" data-filter="Youth">Youth</button>
            <button class="filter-btn" type="button" data-filter="Festival">Festival</button>
          </div>

          <div class="calendar-shell">
            <div class="calendar-panel" data-event-calendar></div>
            <div class="list-panel">
              <h3>Selected events</h3>
              <div class="event-list" data-event-list></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="../js/config.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/calendar.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const filterButtons = document.querySelectorAll("[data-filter]");
        const list = document.querySelector("[data-event-list]");
        const events = window.siteData && window.siteData.events ? window.siteData.events : [];

        function renderEvents(filter = "All") {
          const filtered = filter === "All" ? events : events.filter((event) => event.category === filter);
          list.innerHTML = filtered.map((event) => `
            <article class="event-card">
              <span class="event-category">${event.category}</span>
              <h4>${event.title}</h4>
              <p>${event.description}</p>
              <ul class="detail-list">
                <li>${event.date}</li>
                <li>${event.time}</li>
                <li>${event.location}</li>
              </ul>
              <a href="#" class="btn btn-secondary">Add to calendar</a>
            </article>
          `).join("");
        }

        renderEvents();

        filterButtons.forEach((button) => {
          button.addEventListener("click", () => {
            filterButtons.forEach((btn) => btn.classList.toggle("is-active", btn === button));
            renderEvents(button.dataset.filter);
          });
        });

        if (!list.innerHTML.trim()) {
          list.innerHTML = '<p class="empty-state">No events available.</p>';
        }
      });
    </script>
  </body>
</html>
